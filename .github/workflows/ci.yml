name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group test --group lint
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy kfp_anakin

  test:
    name: kfp ${{ matrix.kfp }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2.15.2 is the floor: 2.15 added additional_funcs.
          - { kfp: "2.15.2", python: "3.10" }
          - { kfp: "2.*", python: "3.10" }
          - { kfp: "2.*", python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv
          uv pip install -e . --group test "kfp==${{ matrix.kfp }}"
      - run: uv run --no-sync pytest
      - name: Keyless components against the live API
        # Shared runner IPs can exhaust the keyless per-IP allowance.
        continue-on-error: true
        env:
          ANAKIN_LIVE_TESTS: "1"
        run: uv run --no-sync pytest tests/test_live.py

  build:
    name: Build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Install the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "
          import kfp_anakin
          from importlib.resources import files
          names = [n for n in kfp_anakin.__all__ if n not in ('with_api_key', '__version__')]
          assert len(names) == 24, names
          assert files('kfp_anakin.components.web_data.scrape_url').joinpath('metadata.yaml').is_file()
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
